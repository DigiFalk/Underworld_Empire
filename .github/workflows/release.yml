name: Release

# Publishes a GitHub release for every new plugin version pushed to the main branch.
# Raise "Version:" and DFMG_VERSION in lite/underworld-empire.php, "Version:" and
# DFMG_EXTENDED_VERSION in extended/underworld-empire-extended.php (all the same) and add a
# CHANGELOG.md section. Every release carries underworld-empire.zip and underworld-empire-extended.zip
# (GitHub editions, which update themselves from these releases) and
# underworld-empire-wordpress-org.zip (the edition for the WordPress.org plugin directory).

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          read_header() { grep -m1 -E '^\s*\*\s*Version:' "$1" | sed -E 's/.*Version:\s*//' | tr -d '[:space:]'; }
          read_constant() { grep -m1 "define( '$2'" "$1" | sed -E "s/.*'$2', '([^']+)'.*/\1/"; }
          lite=$(read_header lite/underworld-empire.php)
          lite_constant=$(read_constant lite/underworld-empire.php DFMG_VERSION)
          extended=$(read_header extended/underworld-empire-extended.php)
          extended_constant=$(read_constant extended/underworld-empire-extended.php DFMG_EXTENDED_VERSION)
          if [ "$lite" != "$lite_constant" ] || [ "$lite" != "$extended" ] || [ "$lite" != "$extended_constant" ]; then
            echo "::error::Versions differ: Lite header $lite, DFMG_VERSION $lite_constant, Extended header $extended, DFMG_EXTENDED_VERSION $extended_constant."
            exit 1
          fi
          echo "version=$lite" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$lite" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PHP syntax
        if: steps.version.outputs.exists == 'false'
        run: find lite extended -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build zips
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p build/underworld-empire build/underworld-empire-extended
          rsync -a lite/ build/underworld-empire/
          rsync -a extended/ build/underworld-empire-extended/
          cp CHANGELOG.md build/underworld-empire/
          cp CHANGELOG.md build/underworld-empire-extended/
          .github/scripts/build-wporg.sh build/wordpress-org
          cd build
          zip -rq underworld-empire.zip underworld-empire
          zip -rq underworld-empire-extended.zip underworld-empire-extended
          (cd wordpress-org && zip -rq ../underworld-empire-wordpress-org.zip underworld-empire)

      - name: Release notes
        if: steps.version.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " v "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/notes.md
          [ -s build/notes.md ] || echo "Release ${{ steps.version.outputs.version }}" > build/notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" build/underworld-empire.zip build/underworld-empire-extended.zip build/underworld-empire-wordpress-org.zip \
            --target "$GITHUB_SHA" \
            --title "Underworld Empire ${{ steps.version.outputs.version }}" \
            --notes-file build/notes.md \
            --latest
