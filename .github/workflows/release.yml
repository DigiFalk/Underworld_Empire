name: Release

# Publishes a GitHub release for every new plugin version pushed to the main branch.
# Raise "Version:" and DFMG_VERSION in lite/mafia-pbbg-engine.php, "Version:" and
# DFMG_EXTENDED_VERSION in extended/mafia-pbbg-engine-extended.php (all the same) and add a
# CHANGELOG.md section. Every release carries mafia-pbbg-engine.zip and mafia-pbbg-engine-extended.zip
# (GitHub editions, which update themselves from these releases) and
# mafia-pbbg-engine-wordpress-org.zip (the edition for the WordPress.org plugin directory).

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          read_header() { grep -m1 -E '^\s*\*\s*Version:' "$1" | sed -E 's/.*Version:\s*//' | tr -d '[:space:]'; }
          read_constant() { grep -m1 "define( '$2'" "$1" | sed -E "s/.*'$2', '([^']+)'.*/\1/"; }
          lite=$(read_header lite/mafia-pbbg-engine.php)
          lite_constant=$(read_constant lite/mafia-pbbg-engine.php DFMG_VERSION)
          extended=$(read_header extended/mafia-pbbg-engine-extended.php)
          extended_constant=$(read_constant extended/mafia-pbbg-engine-extended.php DFMG_EXTENDED_VERSION)
          if [ "$lite" != "$lite_constant" ] || [ "$lite" != "$extended" ] || [ "$lite" != "$extended_constant" ]; then
            echo "::error::Versions differ: Lite header $lite, DFMG_VERSION $lite_constant, Extended header $extended, DFMG_EXTENDED_VERSION $extended_constant."
            exit 1
          fi
          echo "version=$lite" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$lite" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PHP syntax
        if: steps.version.outputs.exists == 'false'
        run: find lite extended -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build zips
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir -p build/mafia-pbbg-engine build/mafia-pbbg-engine-extended
          rsync -a lite/ build/mafia-pbbg-engine/
          rsync -a extended/ build/mafia-pbbg-engine-extended/
          cp CHANGELOG.md build/mafia-pbbg-engine/
          cp CHANGELOG.md build/mafia-pbbg-engine-extended/
          .github/scripts/build-wporg.sh build/wordpress-org
          cd build
          zip -rq mafia-pbbg-engine.zip mafia-pbbg-engine
          zip -rq mafia-pbbg-engine-extended.zip mafia-pbbg-engine-extended
          (cd wordpress-org && zip -rq ../mafia-pbbg-engine-wordpress-org.zip mafia-pbbg-engine)

      - name: Release notes
        if: steps.version.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " v "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/notes.md
          [ -s build/notes.md ] || echo "Release ${{ steps.version.outputs.version }}" > build/notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" build/mafia-pbbg-engine.zip build/mafia-pbbg-engine-extended.zip build/mafia-pbbg-engine-wordpress-org.zip \
            --target "$GITHUB_SHA" \
            --title "Mafia PBBG Engine ${{ steps.version.outputs.version }}" \
            --notes-file build/notes.md \
            --latest
